name: Build and Release ZScript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd compiler
          bun install

      - name: Build zsc binary
        run: |
          cd compiler
          mkdir -p dist
          bun build zsc.js --compile --outfile dist/zsc

      - name: Package artifact (Linux & macOS)
        if: runner.os != 'Windows'
        run: |
          cd compiler/dist
          tar -czf zsc-${{ runner.os }}.tar.gz zsc

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd compiler/dist
          powershell Compress-Archive zsc.exe zsc-Windows.zip

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            compiler/dist/*.zip
            compiler/dist/*.tar.gz
