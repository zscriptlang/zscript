name: Build and Release ZScript

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd compiler
          bun install

      - name: Build zsc binary
        run: |
          cd compiler
          mkdir -p dist
          bun build zsc.js --compile --outfile dist/zsc

      # ---------- ZIP (LINUX / MACOS) ----------
      - name: Zip artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd compiler/dist
          zip zsc-${{ matrix.os }}.zip zsc

      # ---------- ZIP (WINDOWS) ----------
      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd compiler\dist
          ren zsc zsc.exe
          powershell Compress-Archive zsc.exe zsc-${{ matrix.os }}.zip

      # ---------- UPLOAD ----------
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: compiler/dist/zsc-${{ matrix.os }}.zip
